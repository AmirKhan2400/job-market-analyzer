[project]
name = "job-market-analyzer"
version = "0.1.0"
description = "An AI-powered job market analyzer for evaluating job opportunities against user profiles."
readme = "README.md"
authors = [
    { name = "amirkhan184", email = "ahdourodian@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
]

[project.scripts]
job-market-analyzer = "job_market_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]