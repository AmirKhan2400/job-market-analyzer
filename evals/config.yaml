benchmark_version: "0.1"
runs_per_case: 1

extraction:
  temperature: 0.0
  max_tokens: 900
  required_skills_weight: 0.75
  preferred_skills_weight: 0.25

recommendation:
  temperature: 0.0
  max_tokens: 300

selection:
  minimum_schema_valid_rate: 0.99
  minimum_required_skills_f1: 0.90
  minimum_preferred_skills_f1: 0.80
  maximum_p95_latency_ms: 3000

models:
  - name: gemini-flash
    provider: openrouter
    model: google/gemini-2.5-flash
    enabled: true
    reasoning_enabled: false
    require_parameters: true
    max_tokens: 900
    input_per_million: 0.3
    output_per_million: 2.5

  - name: gpt-5.4-mini
